# ~/.config/kitty/kitty.conf

# Keybinds
map super+v             paste_from_clipboard
map super+c             copy_to_clipboard
map super+=             increase_font_size
map super+-             decrease_font_size
map super+0             restore_font_size
map super+t             new_tab_with_cwd
map super+shift+t       new_tab
map super+s             new_window_with_cwd
map super+shift+s       new_window
map super+w             close_window
map super+m             neighboring_window left
map super+n             neighboring_window up
map super+e             neighboring_window down
map super+i             neighboring_window right
map super+l             next_layout
map super+shift+m       previous_tab
map super+shift+i       next_tab
map super+d             detach_window
map super+shift+d       detach_window new-tab
map super+f             close_other_windows_in_tab
map super+b             save_as_session --save-only --use-foreground-process --relocatable
# ⇧⏎ as CSI-u so tmux / Claude Code see it
map shift+enter         send_text all \x1b[13;2u

# layouts
enabled_layouts horizontal, vertical

# window transparency
background_opacity 1.0

# inactive window text
inactive_text_alpha 0.25

# wallpaper
# background_image FILEPATH
# background_image_layout scaled

# macos settings
hide_window_decorations titlebar-only
macos_option_as_alt yes
allow_remote_control yes
paste_actions confirm-if-large

# fonts
font_size         14.0
disable_ligatures cursor

scrollback_lines 2000
remember_window_size yes

# Double-click word chars (besides alphanumerics)
select_by_word_characters :@-./_~?&=%+#

# Cursor / mouse
mouse_hide_wait 0.0
cursor_blink_interval 0.5
shell_integration no-cursor
cursor_shape beam

# Rendering latency (ms)
repaint_delay    10
input_delay 3
sync_to_monitor yes

# Bell
visual_bell_duration 0.0
enable_audio_bell yes

open_url_with default
term xterm-kitty

# Window geometry
placement_strategy center
window_border_width 0
# top side bottom
window_padding_width 15 20 15
window_margin_width 0

# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
