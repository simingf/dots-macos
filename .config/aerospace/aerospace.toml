# AeroSpace — https://nikitabobko.github.io/AeroSpace/guide
config-version = 2

start-at-login = true
after-startup-command = ['layout tiles', 'exec-and-forget $HOME/.config/borders/bordersrc']

# v2 no longer infers these from the bindings
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'  # wide monitor → horizontal, tall → vertical

# Mouse follows focus across monitors
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 12
inner.vertical =   12
outer.left =       8
outer.right =      8
outer.bottom =     8
outer.top =        8

# Commands: https://nikitabobko.github.io/AeroSpace/commands
[mode.main.binding]

# Layout
alt-r = 'reload-config'
alt-slash = 'layout tiles horizontal' #'layout tiles horizontal vertical'
alt-comma = 'layout accordion vertical' #'layout accordion horizontal vertical'
alt-0 = 'flatten-workspace-tree'
alt-f = 'fullscreen'

# Focus (Colemak mnei = hjkl)
alt-m = 'focus --boundaries-action wrap-around-the-workspace left'
alt-n = 'focus --boundaries-action wrap-around-the-workspace down'
alt-e = 'focus --boundaries-action wrap-around-the-workspace up'
alt-i = 'focus --boundaries-action wrap-around-the-workspace right'

# Move
alt-left = 'move left'
alt-down = 'move down'
alt-up = 'move up'
alt-right = 'move right'

# Join
alt-shift-m = 'join-with left'
alt-shift-n = 'join-with down'
alt-shift-e = 'join-with up'
alt-shift-i = 'join-with right'

# Resize
alt-minus = 'resize smart -100'
alt-equal = 'resize smart +100'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# iPad as secondary monitor
[workspace-to-monitor-force-assignment]
# 3 = ['secondary', 'main']
# 4 = ['secondary', 'main']
# 5 = ['secondary', 'main']
6 = ['secondary', 'main']
7 = ['secondary', 'main']
8 = ['secondary', 'main']
9 = ['secondary', 'main']
