# Colemak-DH: mnei in place of hjkl. Defaults stay merged unless overridden
# (j/k, p, +, <, > still work). Full list: ? in the app.

[[keymaps]]
command = "SelectNextOrScrollDown"
key_sequence = "n"

[[keymaps]]
command = "SelectPreviousOrScrollUp"
key_sequence = "e"

[[keymaps]]
command = "FocusPreviousWindow"
key_sequence = "m"

[[keymaps]]
command = "FocusNextWindow"
key_sequence = "i"

# Tracks on [ ] (n is taken), seek on , . (PlayRandom moves from . to *)

[[keymaps]]
command = "PreviousTrack"
key_sequence = "["

[[keymaps]]
command = "NextTrack"
key_sequence = "]"

[[keymaps]]
command = { SeekBackward = {} }
key_sequence = ","

[[keymaps]]
command = { SeekForward = {} }
key_sequence = "."

[[keymaps]]
command = "PlayRandom"
key_sequence = "*"

# Volume up on = so both volume keys are shift-free
[[keymaps]]
command = { VolumeChange = { offset = 5 } }
key_sequence = "="
