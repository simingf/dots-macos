# topgrade — non-default settings only (all options: `topgrade --config-reference`)

[misc]
# Cache sudo up front and keep it alive, so unattended runs don't stall on a prompt
pre_sudo = true
sudo_loop = true

# claude_code / cursor / pi / claude_code_plugins / codex: wrapped/sandboxed installs, self-update fails
# containers: don't auto-pull docker images
disable = ["claude_code", "containers", "cursor", "pi", "claude_code_plugins", "codex"]

assume_yes = true

[npm]
use_sudo = false

[yarn]
use_sudo = false

[viteplus]
use_sudo = false

[flatpak]
use_sudo = false

[containers]
use_sudo = false

[lensfun]
use_sudo = false
