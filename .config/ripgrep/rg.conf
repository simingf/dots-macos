### rg.conf (file location set by RIPGREP_CONFIG_PATH)

# only match first N columns of each line
--max-columns=200
# show preview of lines that match but exceed max-columns
--max-columns-preview
# case insensitive is search is all lowercase, else case sensitive
--smart-case
# ignore .gitignore files
--no-ignore

# path styling (iris #ceacf6 — dominant accent)
--colors=path:fg:206,172,246
--colors=path:style:underline

# line number styling (foam #9ccfd8 — secondary/info)
--colors=line:fg:156,207,216

# column number styling
# --column
--no-column
# --colors=column:fg:white
# --colors=column:style:intense
#

# match styling (gold #f6c177 — search)
--colors=match:fg:246,193,119
--colors=match:style:bold

## types

# py
--type-add
py:*.{py, ipynb}*

# go
--type-add
go:*.go*

# web
--type-add
web:*.{html,css,php,phtml,md,js}*

# text
--type-add
text:*.{txt,text,md}*

# ignore

--glob=!.cache/*
--glob=!SteamLibrary/*
--glob=!.steampath/*
--glob=!.steampid/*
--glob=!.wine/*
--glob=!wineprefixes/*
--glob=!Steam/*
--glob=!.steam/*

# maybes

--glob=!.cargo/*
--glob=!.gradle/*
--glob=!.PlayOnLinux/*
