### rg.conf (read via RIPGREP_CONFIG_PATH)

--max-columns=200
--max-columns-preview
--smart-case
# don't respect .gitignore etc.
--no-ignore

# path: iris #ceacf6
--colors=path:fg:206,172,246
--colors=path:style:underline

# line number: foam #9ccfd8
--colors=line:fg:156,207,216

--no-column

# match: gold #f6c177
--colors=match:fg:246,193,119
--colors=match:style:bold

## types

# py
--type-add
py:*.{py, ipynb}*

# go
--type-add
go:*.go*

# web
--type-add
web:*.{html,css,php,phtml,md,js}*

# text
--type-add
text:*.{txt,text,md}*

## ignore
--glob=!.cache/*
--glob=!SteamLibrary/*
--glob=!.steampath/*
--glob=!.steampid/*
--glob=!.wine/*
--glob=!wineprefixes/*
--glob=!Steam/*
--glob=!.steam/*

--glob=!.cargo/*
--glob=!.gradle/*
--glob=!.PlayOnLinux/*
