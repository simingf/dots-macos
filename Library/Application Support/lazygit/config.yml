gui:
  portraitMode: never   # auto stacks panels at <=84 cols (prefix g sidebar, dotslg thirds)
  sidePanelWidth: 0.4
  commitHashLength: 0   # hash still shows in the selected commit's main-panel header
  theme:
    activeBorderColor:
      - '#ceacf6'
      - bold
    inactiveBorderColor:
      - '#6e6a86'
    optionsTextColor:
      - '#ceacf6'
    selectedLineBgColor:
      - '#26233a'
    cherryPickedCommitBgColor:
      - '#403d52'
    cherryPickedCommitFgColor:
      - '#ceacf6'
    unstagedChangesColor:
      - '#eb6f92'
    defaultFgColor:
      - '#e0def4'
    searchingActiveBorderColor:
      - '#f6c177'
    authorColors:
      '*': '#ceacf6'
# Colemak-DH mnei schema (KEYBINDS.md): every default binding on m/n/e/i/h/j/k/l (either case) swaps
# m↔h n↔j e↔k i↔l. A pure permutation, so no new conflicts: n/e down/up, m/i prev/next panel,
# j/J next/prev match, k edit, h rebase menu, l ignore/interactive-rebase/gitflow/init.
keybinding:
  universal:
    prevItem-alt: e
    nextItem-alt: 'n'
    prevBlock-alt: m
    nextBlock-alt: i
    scrollLeft: M
    scrollRight: I
    scrollUpMain-alt1: E
    scrollDownMain-alt1: 'N'
    nextMatch: j
    prevMatch: J
    new: j
    edit: k
    createRebaseOptionsMenu: h
  files:
    ignoreFile: l
    openMergeOptions: H
  branches:
    mergeIntoCurrentBranch: H
    moveCommitsToNewBranch: J
    viewGitFlowOptions: l
  commits:
    startInteractiveRebase: l
  main:
    prevFile: J
    nextFile: j
    editSelectHunk: K
  submodules:
    init: l
