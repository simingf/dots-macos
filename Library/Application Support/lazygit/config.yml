gui:
  portraitMode: never   # auto stacks panels at <=84 cols (prefix g sidebar, dotslg thirds)
  sidePanelWidth: 0.4
  commitHashLength: 0   # hash still shows in the selected commit's main-panel header
  theme:
    activeBorderColor:
      - '#ceacf6'
      - bold
    inactiveBorderColor:
      - '#6e6a86'
    optionsTextColor:
      - '#ceacf6'
    selectedLineBgColor:
      - '#26233a'
    cherryPickedCommitBgColor:
      - '#403d52'
    cherryPickedCommitFgColor:
      - '#ceacf6'
    unstagedChangesColor:
      - '#eb6f92'
    defaultFgColor:
      - '#e0def4'
    searchingActiveBorderColor:
      - '#f6c177'
    authorColors:
      '*': '#ceacf6'
