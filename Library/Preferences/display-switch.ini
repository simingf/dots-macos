# display-switch (https://github.com/haimgel/display-switch) — Mac side only.
# KVM → Mac: keyboard appears → monitor to USB-C. KVM → PC: keyboard gone → monitor to DP.
# The LG 34GS95QE ignores standard DDC input switching (VCP 0x60), so call m1ddc's
# LG alternate addressing instead: USB-C = 209, DP = 208 (verified 2026-10-08).

# Wooting 60HE v2 (behind the KVM)
usb_device = "31e3:1342"

on_usb_connect_execute = "/opt/homebrew/bin/m1ddc set input-alt 209"
on_usb_disconnect_execute = "/opt/homebrew/bin/m1ddc set input-alt 208"
