# prefix — C-Space on both Mac and Linux, emitted by right_cmd-tap (Karabiner).
# No longer nested (run tmux OR sshdev from a base terminal), so no uname split.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Resolve $DOTFILES_DIR into tmux's own global env — every scripts/*.sh bind and
# hook below is invoked as "$DOTFILES_DIR/scripts/...". A persistent server (e.g.
# Coder) can start without the shell's export, leaving it empty (→ "/scripts/..."
# 127 errors). tmux doesn't expand ~ or $HOME, so let sh resolve it here.
run-shell 'tmux set-environment -g DOTFILES_DIR "$HOME/dots-$([ "$(uname)" = Linux ] && echo linux || echo macos)"'

# general
set -g mouse on
set -g allow-passthrough on                                                    # forward kitty graphics / OSC sequences inner→outer (e.g. `kitten icat`). One-way: terminal replies are intercepted by tmux, so apps that *probe* graphics support (viuer/spotify_player) still hang and need a TERM shim instead.
set -ga update-environment TERM                                                # re-import TERM + TERM_PROGRAM into the session env (tmux drops TERM_PROGRAM by
set -ga update-environment TERM_PROGRAM                                         #   default) so yazi/snacks.image detect ghostty and use its kitty unicode-placeholder protocol for image previews. See yazi-rs.github.io/docs/image-preview.
set -g escape-time 0
set -g focus-events on                                                         # forward terminal focus-in/out to inner apps (Claude Code, nvim autoread, etc.) — tmux swallows them by default
set -g repeat-time 500                                                         # default 500ms — window of time after a `-r` bind to chain another tap without re-pressing prefix
set -g display-panes-time 60000                                                # 60s; dismisses on key press
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Auto tab (window) names: current dir when idle (a shell), else the running command name —
# #{pane_current_command} is argv[0], so flags like -x / --test are already stripped. Keeps names
# meaningful and stable instead of flapping "zsh"/"bash" as focus moves between panes. When the agent
# sidebar pane is the active one (e.g. right after a click), keep the current name rather than renaming to
# the sidebar's own cwd ("charts") — so the sidebar never pollutes the window name.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{@agent_sidebar},#{window_name},#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},fish},#{==:#{pane_current_command},sh}}}},#{b:pane_current_path},#{pane_current_command}}}'

# close a window when only the agent sidebar pane is left, so exiting your last real pane closes the tab
# instead of leaving a lone sidebar (sidebar is auto-added by prefix c; see scripts/tmux-agents.sh reap).
set-hook -g window-layout-changed 'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh reap #{window_id}"'
# seed the sidebar into every new session's first window too (tmux startup + prefix C); prefix c covers the rest
set-hook -g session-created 'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh sidebar-open"'
# live-refresh any open agent sidebar the instant the session/window structure changes — event-driven, no
# polling (so the panel doesn't flash on a timer). Each POSTs a reload into every sidebar's fzf --listen
# socket. All low-frequency (human-paced), so idle cost is ~nil. See tmux-agents.sh refresh.
#
# Focus-changing events (session / window / pane switch) go through `mark-read`: it first runs `deflect` — if
# the pane you landed on is the agent sidebar (keyboard nav into the leftmost pane, a `prefix <n>`/click tab
# switch onto a tab whose active pane is the sidebar, or a no-op sidebar click), bounce focus back to that
# tab's last real pane so the sidebar is never keyboard-focused — then flips the pane you entered from unread
# (blue) → read (gray) if it's an agent, then refreshes (also moves the "you are here" gray highlight). Wired
# to ALL THREE focus transitions, not just after-select-pane: select-window / switch-client (prefix <n>,
# prefix w, sidebar w: clicks) don't fire after-select-pane, so tab/session switches onto a sidebar need
# session-window-changed / client-session-changed to bounce too. (pane-focus-in needs terminal focus events.)
set-hook -g client-session-changed 'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh mark-read"'
set-hook -g session-window-changed 'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh mark-read"'
set-hook -g after-select-pane      'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh mark-read"'
set-hook -g window-linked          'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh"'
set-hook -g window-unlinked        'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh"'
set-hook -g after-rename-window    'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh"'  # tmux has no window-renamed hook; renames arrive via this command hook
set-hook -g session-renamed        'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh"'
# agent working/idle status: agents signal state via their OSC pane title, so refresh on title changes too.
# This fires often (the working spinner rewrites the title several frames/sec), so it goes through the
# debounced refresh-agents path — coalesced + content-deduped so a steady spinner causes zero reloads and
# only a real working↔idle transition repaints. See scripts/tmux-agents.sh _refresh_agents.
set-hook -g pane-title-changed     'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh-agents"'
# keep the sidebar a fixed width when the window is resized (plug/unplug a monitor, reattach) — tmux would
# otherwise redistribute pane widths proportionally and grow it. Must be `window-resized`, NOT `client-resized`:
# a monitor connect resizes the *window* via `window-size latest` accounting without firing a per-client
# resize event, so client-resized misses it entirely (verified). See scripts/tmux-agents.sh fix-width.
set-hook -g window-resized         'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh fix-width"'

# Linux dev boxes default-login-shell is bash; macOS zsh is at /bin/zsh, so this is a no-op there.
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

# ghostty
set -g default-terminal "xterm-ghostty"                                        # inner apps' $TERM — requires xterm-ghostty terminfo installed; otherwise `clear`/tput break ("terminals database inaccessible")
set -g extended-keys on                                                        # was `always`, but snacks.image only recognizes `on` (matches ` on$`); under `always` it thinks extended-keys are off, sends its XTVERSION probe, and the reply leaks into buffers as text (see learnings/nvim-yazi-image-previews.md). `on` still forwards CSI-u to apps that negotiate it.
set -as terminal-features 'xterm*:extkeys:RGB:hyperlinks:clipboard'            # ghostty features tmux's defaults/terminfo miss: extkeys (CSI-u), RGB (truecolor), hyperlinks (OSC 8), clipboard (OSC 52). Requires `tmux kill-server` after changes.
set -g set-clipboard on                                                        # tmux copy-mode pushes selections to outer terminal via OSC 52 → Mac clipboard, even over SSH
bind -n S-Enter send-keys -l "\e[13;2u"                                        # extended-keys doesn't cover modifier+Enter specifically — without this bind, S-Enter is swallowed instead of forwarded

# status bar — rose pine
set -g status-position top
set -g status-left-length 30
set -g status-right '#[fg=#ceacf6]#($DOTFILES_DIR/scripts/tmux-agents.sh count)#[fg=#908caa] %H:%M %d-%b '  # ✳ working/total agents in iris (matches current-tab color), then clock
set -g status-style '#{?client_prefix,bg=#26233a,bg=default},fg=#e0def4'       # overlay bg on prefix, transparent otherwise
set -g status-left-style 'fg=#ceacf6,bold'                                     # [session], bold iris — matches pane active border / bordersrc
set -g status-right-style 'fg=#908caa'                                         # subtle
setw -g window-status-style 'fg=#6e6a86'                                       # unfocused windows, muted (dim)
setw -g window-status-current-style 'fg=#ceacf6,bold'                          # focused window, bold iris — matches pane active border / bordersrc
setw -g window-status-format '#I:#W#{s/-//:window_flags}'                      # strip the '-' flag (most-recently-focused); keep Z/!/# etc.
setw -g window-status-current-format '#I:#W#{s/\*//:window_flags}'             # color+bold already signal active; strip the '*' flag (keep Z, etc.)
setw -g window-status-activity-style 'fg=#f6c177'                              # notifications, gold
set -g message-style 'bg=#26233a,fg=#e0def4'                                   # overlay bg, text fg
set -g mode-style    'bg=#ceacf6,fg=#191724'                                   # copy-mode selection — iris (matches nvim Visual / ghostty selection)

# pane border
set -g pane-border-indicators off                                              # status row already indicates active pane; no arrow needed
set -g pane-border-status top                                                  # per-pane status row at top — inherits pane-(active-)border-style for color
set -g pane-border-format ' #{pane_index} #{pane_current_command} '            # row content: pane index + what's running (zsh/nvim/...)
set -g pane-border-style        'fg=#6e6a86'                                   # inactive border, muted — matches bordersrc inactive_color
set -g pane-active-border-style 'fg=#ceacf6,bold'                              # active border, iris — matches bordersrc active_color
set -g pane-border-lines        heavy                                          # thicker glyphs (│ → ┃)

# popups + menus — square (single) borders in iris; the -T panel titles inherit the border style, so they
# go iris too. Prompts are colored iris in-script/via fzf; typed & inner text stays default (white).
set -g popup-border-lines single
set -g popup-border-style 'fg=#ceacf6'                                         # border + panel title for rename r/R and pickers w/s/f
set -g menu-border-lines  single
set -g menu-border-style  'fg=#ceacf6'                                         # kill menus k/K/x (+ mouse menus); their titles are already iris inline

# config
bind C-r source-file ~/.tmux.conf \; display "Config reloaded!"                # C-r = reload

# noun-based keys: lowercase = switch (fzf/picker), UPPERCASE = last (toggle)
# s/S = session, w/W = window, p/P = pane, a = agent picker, A = agent sidebar

bind s    run-shell '$DOTFILES_DIR/scripts/tmux-fzf-sessions.sh'               # switch session (fzf)
bind S    switch-client -l                                                     # last session
bind w    run-shell '$DOTFILES_DIR/scripts/tmux-fzf-windows.sh switch'         # switch window (fzf)
bind W    last-window                                                          # last window
bind p    if-shell '[ "#{window_panes}" -gt 1 ]' display-panes 'display-message "Only one pane!"'
bind P    last-pane                                                            # last pane
bind f    display-popup -E -w 80% -h 70% -T ' search panes ' '$DOTFILES_DIR/scripts/tmux-fzf-pane-content.sh'  # grep scrollback content across all panes (fzf); switches to the matching pane. overrides default find-window
bind a    run-shell '$DOTFILES_DIR/scripts/tmux-agents.sh'                     # switch to an agent pane (fzf); ● working / ○ idle, cross-session
bind A    run-shell '$DOTFILES_DIR/scripts/tmux-agents.sh sidebar'             # toggle live agent sidebar (24-col left split; press again to close)
bind -r Tab  last-window                                                       # last window (alias for W)
bind -r BTab switch-client -l                                                  # last session (alias for S)

# verb-based keys: lowercase = window, UPPERCASE = session
# pane equivalents use dedicated keys (\ - for split, x for kill)

bind -r c new-window -c "#{pane_current_path}" \; run-shell '$DOTFILES_DIR/scripts/tmux-agents.sh sidebar-open'  # new window (inherits cwd) + agent sidebar on the left (~24 cols)
bind C    display-popup -w 50 -h 3 -T '#[align=centre] new session ' -E '$DOTFILES_DIR/scripts/tmux-rename.sh new'       # create/switch session in a centered popup (Escape cancels) — off the top status line
bind r    display-popup -w 50 -h 3 -T '#[align=centre] rename: #W ' -E '$DOTFILES_DIR/scripts/tmux-rename.sh window'   # rename window in a centered popup (Escape cancels); centre title so it doesn't overdraw the top-left corner
bind R    display-popup -w 50 -h 3 -T '#[align=centre] rename: #S ' -E '$DOTFILES_DIR/scripts/tmux-rename.sh session'  # rename session in a centered popup (Escape cancels)
# kill via a centered display-menu (floating overlay) instead of confirm-before — a status-line prompt
# gets jammed among the top window tabs (right half of a wide tab list shows past it). y=confirm, Esc/n=cancel.
bind k    display-menu -x C -y C -T '#[align=centre,fg=#ceacf6,bold] kill window #W? '  'Yes' y kill-window  'No' n ''    # kill window
bind K    display-menu -x C -y C -T '#[align=centre,fg=#ceacf6,bold] kill session #S? ' 'Yes' y kill-session 'No' n ''   # kill session
bind x    display-menu -x C -y C -T '#[align=centre,fg=#ceacf6,bold] kill pane #P? '     'Yes' y kill-pane    'No' n ''   # kill pane (override default confirm-before, which jams the top status line)

# window position
bind -r , previous-window                                                      # prev (< without shift)
bind -r . next-window                                                          # next (> without shift)
bind -r "<" swap-window -t -1 \; previous-window                               # push window backward
bind -r ">" swap-window -t +1 \; next-window                                   # push window forward

# pane movement (colemak-dh: mnei = hjkl)
bind -r m select-pane -L
bind -r n select-pane -D
bind -r e select-pane -U
bind -r i select-pane -R

# pane resize (colemak-dh: MNEI = HJKL)
bind -r M resize-pane -L 5
bind -r N resize-pane -D 5
bind -r E resize-pane -U 5
bind -r I resize-pane -R 5

# pane split
bind -r '\' split-window -h -c "#{pane_current_path}"                          # \ ≈ vertical divider
bind -r '-' split-window -v -c "#{pane_current_path}"                          # - = horizontal divider

# pane position
bind -r "[" swap-pane -U                                                       # push pane backward
bind -r "]" swap-pane -D                                                       # push pane forward
bind 0 select-layout even-horizontal                                           # side-by-side columns, evenly sized

# pane ↔ window
# ! = break-pane (default) — pull current pane into its own new window
bind @ run-shell '$DOTFILES_DIR/scripts/tmux-fzf-windows.sh join'              # fzf pick window, move pane into it

# copy-mode navigation (colemak-dh: mnei = hjkl, j/J = search repeat, k = word-end) —
# mirrors the nvim normal-mode swap so movement is identical inside scrollback/selection.
# mode-keys already resolves to vi (inferred from $EDITOR=nvim); set explicitly so these
# binds always land in the vi table even if $EDITOR changes.
set -g mode-keys vi
bind -T copy-mode-vi m send-keys -X cursor-left
bind -T copy-mode-vi n send-keys -X cursor-down
bind -T copy-mode-vi e send-keys -X cursor-up
bind -T copy-mode-vi i send-keys -X cursor-right
bind -T copy-mode-vi j send-keys -X search-again                               # repeat last search (forward); n was reclaimed for "down"
bind -T copy-mode-vi J send-keys -X search-reverse                             # repeat last search (backward)
bind -T copy-mode-vi k send-keys -X next-word-end                             # e was reclaimed for "up"

# misc
bind y setw synchronize-panes \; display "Sync: #{?pane_synchronized,ON,OFF}"  # yoke panes together
