# prefix — C-Space everywhere. Karabiner sends it before each key while right ⌘ is held
# (scripts/karabiner-hold-leaders.py), so chain by holding: no -r binds, repeat-time 0.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# $DOTFILES_DIR for every scripts/*.sh bind/hook below. Set in tmux's own env since a
# persistent server (Coder) may start without the shell export; tmux doesn't expand ~/$HOME.
run-shell 'tmux set-environment -g DOTFILES_DIR "$HOME/dots-$([ "$(uname)" = Linux ] && echo linux || echo macos)"'

# general
set -g mouse on
set -g allow-passthrough on                                                    # kitty graphics / OSC inner→outer. One-way: apps that probe for support (viuer) still hang
set -ga update-environment TERM                                                # so yazi / snacks.image detect ghostty for image previews
set -ga update-environment TERM_PROGRAM                                         #   (tmux drops TERM_PROGRAM by default)
set -g escape-time 0
set -g focus-events on                                                         # pass focus-in/out to apps (nvim autoread, Claude, lazygit refresh)
set -g repeat-time 0                                                           # chain by holding right ⌘ instead; a key right after a bind always reaches the pane
set -g display-panes-time 60000                                                # 60s; dismisses on key press
set -g display-time 1000                                                       # native messages we can't reroute; our own notifs use tmux-notify.sh
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Tab names: cwd basename for a shell, else the command. A focused @sidebar pane keeps the current name.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{@sidebar},#{window_name},#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},fish},#{==:#{pane_current_command},sh}}}},#{b:pane_current_path},#{pane_current_command}}}'

# Agent tab dots (@agent_dot, painted by tmux-agents.sh). Hooks make changes land at once; the
# status-right `count` poll catches the rest.
#   mark-read: on all three focus changes (select-window / switch-client don't fire after-select-pane)
#   refresh-agents: title changes — debounced + deduped, the spinner rewrites the title many times/sec
set-hook -g client-session-changed 'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh mark-read"'
set-hook -g session-window-changed 'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh mark-read"'
set-hook -g after-select-pane      'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh mark-read"'
set-hook -g window-linked          'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh"'
set-hook -g window-unlinked        'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh"'
set-hook -g after-rename-window    'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh"'  # no window-renamed hook
set-hook -g session-renamed        'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh"'
set-hook -g pane-title-changed     'run-shell -b "$DOTFILES_DIR/scripts/tmux-agents.sh refresh-agents"'
# Lazygit sidebar (prefix g): park it when it's alone, re-pin its width on layout change / window-resized
# (not client-resized), and kill the `_lazygit` stash once no real session is left.
set-hook -g window-layout-changed  'run-shell -b "$DOTFILES_DIR/scripts/tmux-lazygit.sh layout #{window_id}"'
set-hook -g window-resized         'run-shell -b "$DOTFILES_DIR/scripts/tmux-lazygit.sh fix-width"'
set-hook -g session-closed         'run-shell -b "$DOTFILES_DIR/scripts/tmux-lazygit.sh gc"'

# Linux box's login shell is bash; no-op on mac (/bin/zsh)
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

# ghostty
set -g default-terminal "xterm-ghostty"                                        # needs xterm-ghostty terminfo, else clear/tput break
set -g extended-keys on                                                        # not `always`: snacks.image only recognizes `on`, else its probe reply leaks into buffers
set -as terminal-features 'xterm*:extkeys:RGB:hyperlinks:clipboard'            # CSI-u, truecolor, OSC 8, OSC 52; changes need `tmux kill-server`
set -g set-clipboard on                                                        # copy-mode → OSC 52 → Mac clipboard, even over ssh
bind -n S-Enter send-keys -l "\e[13;2u"                                        # extended-keys doesn't forward S-Enter on its own

# status bar — rose pine
set -g status-position top
set -g status-left-length 30
set -g status-right-length 120                                                 # room for the @notify segment + agent count + clock
# [@notify (gold, tmux-notify.sh)] [agent count] [clock]. Notif sits left so the clock never shifts;
# commas inside #[…] are escaped as #, so the #{?…} parses.
set -g status-interval 2                                                       # `count` doubles as the agent-dot poll (screen changes fire no hook)
set -g status-right '#{?@notify,#[fg=#191724#,bg=#f6c177#,bold] #{@notify} #[default]  ,}#[fg=#ceacf6]#($DOTFILES_DIR/scripts/tmux-agents.sh count)#[fg=#908caa] %H:%M %d-%b '
set -g status-style 'bg=default,fg=#e0def4'                                    # transparent; no prefix highlight (would only flash)
set -g status-left-style 'fg=#ceacf6,bold'                                     # [session], iris
set -g status-right-style 'fg=#908caa'                                         # subtle
setw -g window-status-style 'fg=#6e6a86'                                       # unfocused, muted
setw -g window-status-current-style 'fg=#ceacf6,bold'                          # focused, iris
setw -g window-status-format '#{?window_zoomed_flag,⛶  ,}#I:#W#{s/-//:#{s/Z//:window_flags}}#{E:@agent_dot}'           # ⛶ when zoomed, agent dot; strip Z and '-'
setw -g window-status-current-format '#{?window_zoomed_flag,⛶  ,}#I:#W#{s/\*//:#{s/Z//:window_flags}}#{E:@agent_dot}'  # same; strip Z and '*'
setw -g window-status-separator '#[fg=#6e6a86] | '                             # muted pipe between tabs
setw -g window-status-activity-style 'fg=#f6c177'                              # gold
set -g message-style 'bg=#26233a,fg=#e0def4'                                   # overlay bg
set -g mode-style    'bg=#ceacf6,fg=#191724'                                   # copy-mode selection, iris (= nvim Visual)

# pane border
set -g pane-border-indicators off                                              # border color already shows the active pane
set -g pane-border-status top                                                  # per-pane title row
set -g pane-border-format ' #{pane_index} #{pane_current_command} '            # index + running command
set -g pane-border-style        'fg=#6e6a86'                                   # inactive, muted
set -g pane-active-border-style 'fg=#ceacf6,bold'                              # active, iris
set -g pane-border-lines        heavy                                          # ┃

# popups + menus — iris single borders (-T titles inherit it)
set -g popup-border-lines single
set -g popup-border-style 'fg=#ceacf6'                                         # rename r/R, pickers w/s/f
set -g menu-border-lines  single
set -g menu-border-style  'fg=#ceacf6'                                         # kill menus k/K/x
set -g popup-style        default                                              # tmux ≥3.8 defaults to a gray fill;
set -g menu-style         default                                              #   pin terminal bg
set -g menu-selected-style 'bg=#ceacf6,fg=#191724'                             # iris, like mode-style

# config
bind C-r source-file ~/.tmux.conf \; run-shell '$DOTFILES_DIR/scripts/tmux-notify.sh "Config reloaded!"'   # reload

# noun keys: lowercase = pick (fzf), UPPERCASE = last. s/S session, w/W window, p/P pane, a agent
bind s    run-shell '$DOTFILES_DIR/scripts/tmux-fzf-sessions.sh'               # switch session (fzf)
bind S    switch-client -l                                                     # last session
bind w    run-shell '$DOTFILES_DIR/scripts/tmux-fzf-windows.sh switch'         # switch window (fzf)
bind W    last-window                                                          # last window
bind p    if-shell '[ "#{window_panes}" -gt 1 ]' display-panes 'run-shell "$DOTFILES_DIR/scripts/tmux-notify.sh \"Only one pane!\""'
bind P    last-pane                                                            # last pane
bind f    display-popup -E -w 80% -h 70% -T ' search panes ' '$DOTFILES_DIR/scripts/tmux-fzf-pane-content.sh'  # grep all panes' scrollback, jump to match
bind a    run-shell '$DOTFILES_DIR/scripts/tmux-agents.sh'                     # agent picker, cross-session
bind g    run-shell '$DOTFILES_DIR/scripts/tmux-lazygit.sh toggle "#{pane_current_path}" "#{pane_id}"'   # toggle lazygit sidebar (left, follows nvim's repo)
bind Tab  last-window                                                          # = W
bind BTab switch-client -l                                                     # = S

# prefix <digit> = window N; a miss goes to tmux-notify.sh, not the native error line (0 = even-columns)
bind 1 run-shell 'tmux select-window -t :1 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 1"'
bind 2 run-shell 'tmux select-window -t :2 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 2"'
bind 3 run-shell 'tmux select-window -t :3 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 3"'
bind 4 run-shell 'tmux select-window -t :4 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 4"'
bind 5 run-shell 'tmux select-window -t :5 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 5"'
bind 6 run-shell 'tmux select-window -t :6 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 6"'
bind 7 run-shell 'tmux select-window -t :7 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 7"'
bind 8 run-shell 'tmux select-window -t :8 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 8"'
bind 9 run-shell 'tmux select-window -t :9 2>/dev/null || $DOTFILES_DIR/scripts/tmux-notify.sh "no window 9"'

# verb keys: lowercase = window, UPPERCASE = session (panes: \ - split, x kill)
bind c new-window -c "#{pane_current_path}"                                    # inherits cwd
bind C    display-popup -w 50 -h 3 -T '#[align=centre] new session ' -E '$DOTFILES_DIR/scripts/tmux-rename.sh new'       # new/switch session (Esc cancels)
bind r    display-popup -w 50 -h 3 -T '#[align=centre] rename: #W ' -E '$DOTFILES_DIR/scripts/tmux-rename.sh window'   # rename window (Esc cancels)
bind R    display-popup -w 50 -h 3 -T '#[align=centre] rename: #S ' -E '$DOTFILES_DIR/scripts/tmux-rename.sh session'  # rename session
# kill via a centered menu, not confirm-before (its prompt gets jammed among the top tabs)
bind k    display-menu -x C -y C -T '#[align=centre,fg=#ceacf6,bold] kill window #W? '  'Yes' y kill-window  'No' n ''    # kill window
bind K    display-menu -x C -y C -T '#[align=centre,fg=#ceacf6,bold] kill session #S? ' 'Yes' y kill-session 'No' n ''   # kill session
bind x    display-menu -x C -y C -T '#[align=centre,fg=#ceacf6,bold] kill pane #P? '     'Yes' y kill-pane    'No' n ''   # kill pane

# window position
bind , previous-window                                                         # prev (< without shift)
bind . next-window                                                             # next (> without shift)
bind "<" swap-window -t -1 \; previous-window                                  # push window backward
bind ">" swap-window -t +1 \; next-window                                      # push window forward

# pane movement (mnei = hjkl) — tmux-nav.sh moves between nvim splits first, crosses panes at nvim's edge
bind m run-shell '$DOTFILES_DIR/scripts/tmux-nav.sh L #{pane_id} #{?#{==:#{pane_current_command},nvim},#{@nvim_server},}'
bind n run-shell '$DOTFILES_DIR/scripts/tmux-nav.sh D #{pane_id} #{?#{==:#{pane_current_command},nvim},#{@nvim_server},}'
bind e run-shell '$DOTFILES_DIR/scripts/tmux-nav.sh U #{pane_id} #{?#{==:#{pane_current_command},nvim},#{@nvim_server},}'
bind i run-shell '$DOTFILES_DIR/scripts/tmux-nav.sh R #{pane_id} #{?#{==:#{pane_current_command},nvim},#{@nvim_server},}'

# pane resize (MNEI = HJKL); M/I then let the other columns share the change evenly
bind M resize-pane -L 5 \; run-shell '$DOTFILES_DIR/scripts/tmux-even-columns.sh pane #{pane_id}'
bind N resize-pane -D 5
bind E resize-pane -U 5
bind I resize-pane -R 5 \; run-shell '$DOTFILES_DIR/scripts/tmux-even-columns.sh pane #{pane_id}'

# pane split
bind '\' split-window -h -c "#{pane_current_path}"                             # \ ≈ vertical divider   → pane to the right
bind '-' split-window -v -c "#{pane_current_path}"                             # - = horizontal divider → pane to the bottom
bind '|' split-window -h -b -c "#{pane_current_path}"                          # | = vertical divider   → pane to the left (-b = before)
bind '_' split-window -v -b -c "#{pane_current_path}"                          # _ = horizontal divider → pane on top    (-b = before)

# pane position
bind "[" swap-pane -U                                                          # push pane backward
bind "]" swap-pane -D                                                          # push pane forward
bind 0 run-shell '$DOTFILES_DIR/scripts/tmux-even-columns.sh'                   # equal columns; keeps @sidebar width + stacks

# pane ↔ window
# ! = break-pane (default) — pull current pane into its own new window
bind @ run-shell '$DOTFILES_DIR/scripts/tmux-fzf-windows.sh join'              # fzf pick window, move pane into it

# copy-mode: mnei = hjkl, j/J = search again, k = word end (same swap as nvim)
set -g mode-keys vi                                                            # explicit, not inferred from $EDITOR
set -g status-keys emacs                                                       # Esc cancels prompts (vi would enter prompt normal mode)
bind -T copy-mode-vi m send-keys -X cursor-left
bind -T copy-mode-vi n send-keys -X cursor-down
bind -T copy-mode-vi e send-keys -X cursor-up
bind -T copy-mode-vi i send-keys -X cursor-right
bind -T copy-mode-vi j send-keys -X search-again                               # n is down
bind -T copy-mode-vi J send-keys -X search-reverse                             # reverse
bind -T copy-mode-vi k send-keys -X next-word-end                             # e is up

# Copy on drag-release outside the origin pane (other pane, tab bar, border) — tmux drops it otherwise,
# leaving the selection stuck. Mouse-reporting apps (nvim) also get the release forwarded.
bind -n MouseDragEnd1Pane          if -F '#{mouse_any_flag}' 'send-keys -M' \; run-shell -b '$DOTFILES_DIR/scripts/tmux-copy-dragend.sh'
bind -n MouseDragEnd1Status        run-shell -b '$DOTFILES_DIR/scripts/tmux-copy-dragend.sh'
bind -n MouseDragEnd1StatusLeft    run-shell -b '$DOTFILES_DIR/scripts/tmux-copy-dragend.sh'
bind -n MouseDragEnd1StatusRight   run-shell -b '$DOTFILES_DIR/scripts/tmux-copy-dragend.sh'
bind -n MouseDragEnd1StatusDefault run-shell -b '$DOTFILES_DIR/scripts/tmux-copy-dragend.sh'
# border release also rebalances columns (like prefix M/I)
bind -n MouseDragEnd1Border        run-shell -b '$DOTFILES_DIR/scripts/tmux-copy-dragend.sh; $DOTFILES_DIR/scripts/tmux-even-columns.sh border #{mouse_x}'

# Editing gestures for zsh / nvim / Claude — plain bytes, so they also work over ssh.
#   click-to-move: plain click on a zsh prompt → offset in @click ("dy dx width cursor_x") + \e[9000~ (30-interactive.zsh)
#   drag over Claude: tmux copy-mode takes it, so it copies + clears on release like elsewhere
#   ⌘ keys: ghostty sends \e[9001~…\e[9017~ (User0-16); tmux-cmdkey.sh maps each to the app's action (see KEYBINDS.md)
bind -n MouseUp1Pane if -F -t = '#{&&:#{==:#{pane_current_command},zsh},#{?#{||:#{alternate_on},#{||:#{pane_in_mode},#{mouse_any_flag}}},0,1}}' \
  'set -pF -t = @click "#{e|-:#{mouse_y},#{cursor_y}} #{e|-:#{mouse_x},#{cursor_x}} #{pane_width} #{cursor_x}" ; send-keys -t = -H 1b 5b 39 30 30 30 7e' \
  'send-keys -M -t ='
set -g @is_agent '#{||:#{==:#{pane_current_command},claude},#{m/r:^([⠀-⣿◐-◓✳✶✻✽]|Claude Code),#{pane_title}}}'
bind -n MouseDrag1Pane if -F -t = '#{&&:#{E:@is_agent},#{&&:#{mouse_any_flag},#{!=:#{pane_in_mode},1}}}' \
  'copy-mode -M -t =' \
  'if -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M -t =" "copy-mode -M -t ="'
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
set -s user-keys[2] "\e[9003~"
set -s user-keys[3] "\e[9004~"
set -s user-keys[4] "\e[9005~"
set -s user-keys[5] "\e[9006~"
set -s user-keys[6] "\e[9007~"
set -s user-keys[7] "\e[9008~"
set -s user-keys[8] "\e[9009~"
set -s user-keys[9] "\e[9010~"
set -s user-keys[10] "\e[9011~"
set -s user-keys[11] "\e[9012~"
set -s user-keys[12] "\e[9013~"
set -s user-keys[13] "\e[9014~"
set -s user-keys[14] "\e[9015~"
set -s user-keys[15] "\e[9016~"
set -s user-keys[16] "\e[9017~"
bind -n User0  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh a       #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User1  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh c       #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User2  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh x       #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User3  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh z       #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User4  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh Z       #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User5  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh left    #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User6  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh right   #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User7  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh s       #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User8  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh clear   #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User9  run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh f       #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User10 run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh p       #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User11 run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh slash   #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User12 run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh indent  #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User13 run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh outdent #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User14 run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh bs      #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User15 run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh sleft   #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'
bind -n User16 run-shell '$DOTFILES_DIR/scripts/tmux-cmdkey.sh sright  #{pane_id} #{pane_in_mode} #{pane_current_command} #{alternate_on} #{E:@is_agent} #{client_name}'

# misc
bind y setw synchronize-panes \; display "Sync: #{?pane_synchronized,ON,OFF}"  # yoke panes together
